name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            name: mdview-linux-x64
          - target: bun-linux-arm64
            name: mdview-linux-arm64
          - target: bun-darwin-x64
            name: mdview-darwin-x64
          - target: bun-darwin-arm64
            name: mdview-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --target=${{ matrix.target }} src/main.ts --outfile ${{ matrix.name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
